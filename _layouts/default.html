<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} | Dalhousie University{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip }}">
<meta property="og:image" content="{{ site.url }}/images/lab_2026.jpg">
<meta property="og:type" content="website">
<link rel="icon" href="{{ '/images/favicon.png' | relative_url }}" type="image/png">
<link rel="apple-touch-icon" href="{{ '/images/logo_512.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
{% include header.html %}
<main id="main">
{{ content }}
</main>
{% include footer.html %}
</body>
</html>
