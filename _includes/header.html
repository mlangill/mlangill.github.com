<header class="site-header">
<div class="wrap">
<a class="brand" href="{{ '/' | relative_url }}">
<img class="brand-logo" src="{{ '/images/logo.png' | relative_url }}" alt="" width="56" height="56">
<span class="brand-text"><span class="brand-name">Langille Lab</span><span class="brand-sub">DALHOUSIE UNIVERSITY</span></span>
</a>
<nav class="site-nav" aria-label="Main">
{% for item in site.nav %}<a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
{% endfor %}</nav>
</div>
</header>
